name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          install_args: go go:golang.org/x/vuln/cmd/govulncheck

      - name: Verify
        run: mise run check:go

      - name: Verify Docker image builds
        run: docker build .
