name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/web/templates/**'
      - 'internal/web/static/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t transients:local .

      - name: Save image to tarball
        run: docker save transients:local | gzip > transients.tar.gz

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Ship image and redeploy
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key transients.tar.gz "$SSH_USER@$SSH_HOST:/tmp/transients.tar.gz"
          scp -i ~/.ssh/deploy_key docker-compose.yml "$SSH_USER@$SSH_HOST:~/transients/docker-compose.yml"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -e
            gunzip -c /tmp/transients.tar.gz | docker load
            rm /tmp/transients.tar.gz
            cd ~/transients
            docker compose up -d
            cid=$(docker compose ps -q transients)
            for i in $(seq 1 15); do
              status=$(docker inspect -f "{{.State.Health.Status}}" "$cid")
              if [ "$status" = "healthy" ]; then
                exit 0
              fi
              sleep 2
            done
            echo "container did not become healthy" >&2
            docker compose logs --tail 50 transients
            exit 1
          '
