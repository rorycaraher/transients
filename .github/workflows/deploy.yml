# Deploy: rebuild and restart the container on the VPS after a merge to main.
#
# This runs no tests. Branch protection on main requires the Go and Infra
# checks (go.yml, infra.yml) to pass on an up-to-date branch before a merge,
# so a commit on main has already been tested.
#
# The path filter lists everything that changes the compiled binary or the
# image. Templates, static assets and SQL migrations are go:embed-ed, so
# they count even though they are not Go files. Merges that touch only docs
# or infra/ do not redeploy.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/db/migrations/**'
      - 'internal/web/templates/**'
      - 'internal/web/static/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

# Queue rather than cancel: killing a deploy halfway can leave the VPS on a
# half-built image.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Pull and rebuild on VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -e
            cd ~/transients
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build
            cid=$(docker compose ps -q transients)
            for i in $(seq 1 15); do
              status=$(docker inspect -f "{{.State.Health.Status}}" "$cid")
              if [ "$status" = "healthy" ]; then
                exit 0
              fi
              sleep 2
            done
            echo "container did not become healthy" >&2
            docker compose logs --tail 50 transients
            exit 1
          '
