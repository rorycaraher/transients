{{define "title"}}NLTL - Edit{{end}}
{{define "content"}}
<main class="narrow">
  <a class="back-link" href="/admin">&#8592; Back</a>
  <h1>Edit track</h1>

  <form method="post" action="/admin/tracks/{{.Track.Slug}}/edit">
    <label>
      Title
      <input type="text" name="title" value="{{.Track.Title}}" required>
    </label>
    <label>
      Description (shown publicly on the share page, blank = hidden)
      <textarea name="description" rows="4">{{.Track.Description}}</textarea>
    </label>
    <label>
      Expires at (blank = never)
      <input type="date" name="expires_at" value="{{.ExpiresAtValue}}">
    </label>
    <label class="checkbox-label">
      <input type="checkbox" name="downloadable" {{if .Track.Downloadable}}checked{{end}}>
      Downloadable
    </label>
    <button type="submit" class="btn-block">Save</button>
  </form>

  <section class="replace-section">
    <h2>Replace file</h2>
    <div id="replace-dropzone" class="dropzone" data-slug="{{.Track.Slug}}">
      <div class="hint" id="replace-dropzone-hint">Drag &amp; drop or click to select a replacement file</div>
      <div class="filename" id="replace-dropzone-filename">No file chosen</div>
      <input type="file" id="replace-file" accept="audio/*">
    </div>
    <div id="replace-progress-wrap" hidden>
      <progress id="replace-progress" value="0" max="100"></progress>
      <p id="replace-status-text">Uploading...</p>
    </div>
    <p id="replace-error" class="error" hidden></p>
  </section>
</main>
<script src="{{static "replace.js"}}"></script>
{{end}}
