repos:
  - repo: local
    hooks:
      - id: infra-lint
        name: infra lint (tofu fmt + tflint)
        entry: mise run lint
        language: system
        pass_filenames: false
        files: ^infra/opentofu/
      - id: policy-test
        name: policy tests (conftest fmt + verify)
        entry: mise run policy
        language: system
        pass_filenames: false
        files: ^infra/policy/
